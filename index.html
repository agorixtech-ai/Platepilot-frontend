<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- This is a client-rendered SPA: social scrapers never run the app JS, so
         everything they know about the site is in this <head>. Keep the copy
         here in sync with the landing page. -->
    <title>PlatePilot — AI-Powered Restaurant Intelligence</title>
    <meta
      name="description"
      content="PlatePilot turns your Tally books, POS sales, and inventory into one live picture of every outlet — food cost, menu performance, auto-reconciliation, and AI insights."
    />
    <meta name="author" content="PlatePilot" />
    <link rel="canonical" href="https://platepilotsystems.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlatePilot" />
    <meta property="og:url" content="https://platepilotsystems.com/" />
    <meta property="og:title" content="PlatePilot — AI-Powered Restaurant Intelligence" />
    <meta
      property="og:description"
      content="Turn your Tally books, POS sales, and inventory into one live picture of every outlet — food cost, menu performance, auto-reconciliation, and AI insights."
    />
    <meta property="og:image" content="https://platepilotsystems.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PlatePilot — turn your Tally and POS data into intelligence"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PlatePilot — AI-Powered Restaurant Intelligence" />
    <meta
      name="twitter:description"
      content="Turn your Tally books, POS sales, and inventory into one live picture of every outlet."
    />
    <meta name="twitter:image" content="https://platepilotsystems.com/og.jpg" />

    <meta name="theme-color" content="#0A1A10" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.jpg" />

    <script>
      (function () {
        try {
          localStorage.setItem("ui-theme", "light");
          var c = document.documentElement.classList;
          c.remove("dark");
          c.add("light");
          document.documentElement.style.colorScheme = "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
