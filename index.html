<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- This is a client-rendered SPA: social scrapers never run the app JS, so
         everything they know about the site is in this <head>. Keep the copy
         here in sync with the landing page. -->
    <title>PlatePielet — AI-Powered Restaurant Intelligence</title>
    <meta
      name="description"
      content="PlatePielet turns your Tally books, POS sales, and inventory into one live picture of every outlet — food cost, menu performance, auto-reconciliation, and AI insights."
    />
    <meta name="author" content="PlatePielet" />
    <link rel="canonical" href="https://platepilotsystems.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlatePielet" />
    <meta property="og:url" content="https://platepilotsystems.com/" />
    <meta property="og:title" content="PlatePielet — AI-Powered Restaurant Intelligence" />
    <meta
      property="og:description"
      content="Turn your Tally books, POS sales, and inventory into one live picture of every outlet — food cost, menu performance, auto-reconciliation, and AI insights."
    />
    <meta property="og:image" content="https://platepilotsystems.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PlatePielet — turn your Tally and POS data into intelligence"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PlatePielet — AI-Powered Restaurant Intelligence" />
    <meta
      name="twitter:description"
      content="Turn your Tally books, POS sales, and inventory into one live picture of every outlet."
    />
    <meta name="twitter:image" content="https://platepilotsystems.com/og.jpg" />

    <meta name="theme-color" content="#0A1A10" />
    <link rel="icon" type="image/png" sizes="500x500" href="/favicon.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />

    <!-- Structured data: site-wide entity signal (Organization + SoftwareApplication)
         plus FAQPage for the homepage FAQ. Keep the FAQ text in sync with
         `FAQS` in src/pages/Index.tsx — it's duplicated here because JSON-LD
         in a client-rendered SPA is only reliably read by crawlers when it's
         static in the initial HTML, not injected after mount. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PlatePielet",
        "url": "https://platepilotsystems.com/",
        "logo": "https://platepilotsystems.com/logo.png"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PlatePielet",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Android",
        "url": "https://platepilotsystems.com/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need new hardware?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. PlatePielet connects to the Tally and POS systems you already run — there's nothing to install at the outlet."
            }
          },
          {
            "@type": "Question",
            "name": "How long does setup take?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most single outlets are live in one afternoon. Multi-outlet groups typically finish onboarding within a week, including historical data import."
            }
          },
          {
            "@type": "Question",
            "name": "Which POS systems are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "POS sales import works with common billing systems, and CSV / Excel import covers everything else. Tally ERP sync is two-way."
            }
          },
          {
            "@type": "Question",
            "name": "Is my business data safe?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Data is encrypted in transit and at rest, scoped per tenant, and never shared. Your books remain yours — export them anytime."
            }
          },
          {
            "@type": "Question",
            "name": "What happens after the free trial?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pick a plan to continue, or export your data and walk away. No credit card is needed to start, so there's nothing to cancel."
            }
          }
        ]
      }
    </script>

    <script>
      (function () {
        try {
          localStorage.setItem("ui-theme", "light");
          var c = document.documentElement.classList;
          c.remove("dark");
          c.add("light");
          document.documentElement.style.colorScheme = "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
